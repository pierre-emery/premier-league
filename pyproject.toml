[project]
name = "plpredict"
version = "0.1.0"
description = "Prédiction des résultats de Premier League : modèles bayésiens (MCMC) vs gradient boosting."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pierre" }]
dependencies = [
    # Données
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",          # lecture/écriture Parquet (format de data/processed)
    "requests>=2.31",
    "soccerdata>=1.8",      # scrapers Understat, ClubElo, football-data.co.uk
    "python-dotenv>=1.0",   # charge le fichier .env (secrets, chemins)
    # Modèles bayésiens
    "pymc>=5.10",
    "arviz>=0.18",
    # Modèles ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "catboost>=1.2",
    # Visualisation
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    # Suivi des expériences
    "wandb>=0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plpredict"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F : erreurs de base, I : tri des imports, B : bugs courants, UP : syntaxe moderne
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
